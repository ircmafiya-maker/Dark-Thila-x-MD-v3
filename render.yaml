services:
  - type: web
    name: dark-thila-xmd
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BOT_NAME
        value: DARK THILA X MD
      - key: PREFIX          # default prefix for new users (they can change it in their dashboard)
        value: "."
      - key: MODE            # default mode for new users: public | private
        value: public
      - key: MAX_SESSIONS    # how many numbers can be linked (each uses ~40-80 MB RAM)
        value: 10
      - key: PAIR_PUBLIC     # true = anyone can link their own number on /pair
        value: "true"
      - key: OWNER_NUMBER    # your number, digits only, e.g. 94771234567
        sync: false
      - key: ADMIN_PASSWORD  # password for /admin (platform owner only)
        sync: false
      - key: SESSION_SECRET  # any long random text, keeps logins after restarts
        generateValue: true
      - key: MONGODB_URI     # needed so sessions survive redeploys
        sync: false
